name: Build Android app

on:
  push:
    paths:
      - 'revengr-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revengr-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android@13.0.0 --nosave

      - name: Build debug APK
        run: npx cordova build android --debug

      - uses: actions/upload-artifact@v4
        with:
          name: revengr-debug-apk
          path: revengr-app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
